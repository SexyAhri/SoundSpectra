name: Build and release installers
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new version after both installers pass'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run version:check
      - name: Check release signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY || !process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) throw Error('Configure the two TAURI signing secrets before publishing. See docs/RELEASING.md.')"
      - name: Prepare versioned draft
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = 'v' + version;
            if (context.ref.startsWith('refs/tags/') && context.ref !== 'refs/tags/' + tag)
              throw new Error('Tag and package version disagree');
            core.setOutput('version', version);
            const publish = context.eventName === 'push' || context.payload.inputs?.publish === 'true';
            if (!publish) { core.setOutput('publish', 'false'); return; }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const candidates = releases.filter(release => release.tag_name === tag);
            let release = candidates.find(release => !release.draft) || candidates.find(release => release.draft);
            if (release && !release.draft) {
              core.setOutput('publish', 'false');
              core.info('Version already published: build artifacts only. Increment the version to publish an update.');
              return;
            }
            if (!release) release = (await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: 'SoundSpectra ' + tag, draft: true, prerelease: version.includes('-'),
              body: 'Windows x64 + macOS Universal (Intel / Apple Silicon).'
            })).data;
            else {
              await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, target_commitish: context.sha });
              for (const asset of release.assets)
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
            }
            core.setOutput('publish', 'true');
            core.setOutput('release_id', String(release.id));
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 1
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: npm ci
      - run: npm run test:release
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: npm run release:prepare
      - name: Build signed installers
        run: npm run desktop:build -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Validate and merge platform updates
        run: node scripts/update-manifest.mjs artifacts/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/publish-release.mjs artifacts/release
