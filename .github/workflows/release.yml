name: Build and release installers
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/tests/**'
      - 'scripts/check-full.mjs'
      - 'scripts/check-browser.mjs'
      - 'playwright.config.ts'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/tests/**'
      - 'scripts/check-full.mjs'
      - 'scripts/check-browser.mjs'
      - 'playwright.config.ts'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new version after both installers pass'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run version:check
      - name: Check release signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY || !process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) throw Error('Configure the two TAURI signing secrets before publishing. See docs/RELEASING.md.')"
      - name: Prepare versioned draft
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/prepare-release.mjs`);
            const version = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version;
            const plan = await prepareRelease({ github, context, version });
            for (const [name, value] of Object.entries(plan)) core.setOutput(name, value);
            if (!plan.build) core.info('Version already published: skip duplicate installers. Bump the version or run manually to build.');
  package:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 1
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: npm ci
      - run: npm run release:prepare
      # Tauri's beforeBuildCommand builds the frontend once. Regression checks
      # live in the manually triggered Checks workflow, outside packaging.
      - name: Build signed installers
        run: npm run desktop:build -- --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Validate and merge platform updates
        run: node scripts/update-manifest.mjs artifacts/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/publish-release.mjs artifacts/release
