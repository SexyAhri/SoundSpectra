[package]
name = "soundspectra"
version = "1.0.12"
description = "Music-reactive desktop scenes with per-application audio capture"
license = "GPL-3.0-only"
authors = ["SexyAhri"]
repository = "https://github.com/SexyAhri/SoundSpectra"
edition = "2021"
rust-version = "1.85"

[lib]
name = "soundspectra_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2.17"
png = "0.18"
lyrics-crypto = "=0.5.1"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
rustfft = "6"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rmpv = "1.3"
symphonia = { version = "0.5.5", features = ["all"] }
ebur128 = "0.1.11"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
webview2-com = "0.39.1"
arboard = "3.7"
windows-core = "0.62"
wasapi = "0.26"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_RestartManager"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Generated Windows bindings are large; omit dependency-only debug assertions.
# Keep assertions enabled in SoundSpectra itself.
[profile.dev.package.windows]
debug-assertions = false

[profile.test.package.windows]
debug-assertions = false
